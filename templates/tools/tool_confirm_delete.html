{% extends "base.html" %}

{% block title %}Supprimer un outil - EmpruntOutils{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-top border-danger border-4">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                <h4 class="fw-bold mt-2">Confirmer la suppression</h4>
                <p class="text-muted">Êtes-vous sûr de vouloir supprimer l'outil <strong>« {{ tool.titre }} »</strong> ? Cette action est irréversible.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'tools:my_tools' %}" class="btn btn-outline-secondary px-4">Annuler</a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-trash me-1"></i>Oui, supprimer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
