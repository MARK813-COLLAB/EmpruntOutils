{% extends "base.html" %}

{% block title %}Supprimer un outil — EmpruntOutils{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: var(--ink);"></i>
                <h2 class="mt-3">Confirmer la suppression</h2>
                <p style="color: var(--ink-soft);">Êtes-vous sûr de vouloir supprimer l'outil <strong>« {{ tool.titre }} »</strong> ? Cette action est irréversible.</p>

                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'tools:my_tools' %}" class="btn btn-secondary px-4">Annuler</a>
                        <button type="submit" class="btn btn-danger px-4">
                            <i class="bi bi-trash me-1"></i>Oui, supprimer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
